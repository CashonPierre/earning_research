[project]
name = "pead-breakout-timing"
version = "0.1.0"
description = "Does post-earnings drift concentrate after the stock clears its earnings-day high? Round 1 research assessment."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.0,<4",
    "numpy>=2.0,<3",
    "pyarrow>=16",
    "matplotlib>=3.9",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pytest>=8",
    "markdown>=3.10.3",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.1",
    "nbclient>=0.11.0",
    "ipykernel>=7.3.0",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
