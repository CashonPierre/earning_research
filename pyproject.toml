[project]
name = "pead-breakout-timing"
version = "0.1.0"
description = "Does post-earnings drift concentrate after the stock clears its earnings-day high? Round 1 research assessment."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
